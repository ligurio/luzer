name: Testing

on:
  push:
  pull_request:

jobs:
  testing:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
        BUILDTYPE: [Debug, Release]
        # "64" is the native build; "32" builds a 32-bit (i386) target
        # with `-m32` and a Lua implementation built from source.
        ARCH: ["64", "32"]
        LIBLUA:
          - "5.5"
          - "5.4"
          - "5.3"
          - "5.2"
          - "5.1"
          - "luajit-v2.1"
        exclude:
          - os: macos-26
            LIBLUA: "5.5"
          - os: macos-26
            LIBLUA: "5.4"
          - os: macos-26
            LIBLUA: "5.3"
          - os: macos-26
            LIBLUA: "5.2"
          - os: macos-26
            LIBLUA: "5.1"
          - os: macos-26
            ARCH: "32"
          # 32-bit builds are only tested with Lua 5.5 and LuaJIT;
          # the other Lua versions are tested in 64-bit only.
          - LIBLUA: "5.4"
            ARCH: "32"
          - LIBLUA: "5.3"
            ARCH: "32"
          - LIBLUA: "5.2"
            ARCH: "32"
          - LIBLUA: "5.1"
            ARCH: "32"
        include:
          - BUILDTYPE: Debug
            CMAKEFLAGS: -DCMAKE_BUILD_TYPE=Debug
          - BUILDTYPE: Release
            CMAKEFLAGS: -DCMAKE_BUILD_TYPE=RelWithDebInfo
          - ARCH: "64"
            ARCHFLAGS: ""
          - ARCH: "32"
            ARCHFLAGS: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32 -DCMAKE_SHARED_LINKER_FLAGS=-m32
          - LIBLUA: "5.5"
            SOURCE_VERSION: "5.5.1"
          - LIBLUA: "5.4"
            SOURCE_VERSION: "5.4.4"
          - LIBLUA: "5.3"
            SOURCE_VERSION: "5.3.6"
          - LIBLUA: "5.2"
            SOURCE_VERSION: "5.2.4"
          - LIBLUA: "5.1"
            SOURCE_VERSION: "5.1.5"
          - LIBLUA: "luajit-v2.1"
            PACKAGES: libluajit-5.1-dev libluajit-5.1-2 luajit
            FLAVORFLAGS: -DLUAJIT_FRIENDLY_MODE=ON -DENABLE_LUAJIT=ON
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Disable processing triggers for man-db
        if: runner.os == 'Linux'
        run: sudo apt-get remove --purge man-db

      - name: Setup Linux packages
        if: runner.os == 'Linux'
        run: |
          # Lua is built from source; 64-bit LuaJIT comes from the
          # distribution package and 32-bit builds need the multilib
          # toolchain.
          PACKAGES=""
          if [ "${{ matrix.ARCH }}" = "32" ]; then
            PACKAGES="gcc-multilib g++-multilib libc6-dev-i386"
          elif [ "${{ matrix.LIBLUA }}" = "luajit-v2.1" ]; then
            PACKAGES="${{ matrix.PACKAGES }}"
          fi
          sudo apt install -y clang-15 libclang-common-15-dev \
            libclang-rt-15-dev $PACKAGES

      - name: Setup macOS packages
        if: runner.os == 'macOS'
        run: brew install llvm luajit cmake ninja

      - name: Build Lua from source
        if: matrix.LIBLUA != 'luajit-v2.1'
        uses: ./.github/actions/build-lua
        with:
          version: ${{ matrix.SOURCE_VERSION }}
          arch: ${{ matrix.ARCH }}

      - name: Build LuaJIT from source (32-bit)
        if: matrix.LIBLUA == 'luajit-v2.1' && matrix.ARCH == '32' && runner.os == 'Linux'
        uses: ./.github/actions/build-luajit
        with:
          arch: "32"

      - name: Running CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -G Ninja -DENABLE_TESTING=ON
          -DCMAKE_C_COMPILER=clang-15 -DCMAKE_CXX_COMPILER=clang++-15
          ${{ matrix.CMAKEFLAGS }} ${{ matrix.ARCHFLAGS }}
          ${{ matrix.FLAVORFLAGS }} ${{ env.LUACFLAGS }}

      - name: Define Brew prefixes (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "BREW_LLVM_PREFIX=`brew --prefix llvm`" >> $GITHUB_ENV
          echo "BREW_LUAJIT_PREFIX=`brew --prefix luajit`" >> $GITHUB_ENV

      - name: Running CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=$BREW_LLVM_PREFIX/bin/clang \
            -DCMAKE_CXX_COMPILER=$BREW_LLVM_PREFIX/bin/clang++ \
            -DLUA_INCLUDE_DIR=$BREW_LUAJIT_PREFIX/include/luajit-2.1 \
            -DLUA_LIBRARIES=$BREW_LUAJIT_PREFIX/lib/libluajit-5.1.dylib \
            -DENABLE_LUAJIT=ON \
            -DLUAJIT_FRIENDLY_MODE=ON \
            ${{ matrix.CMAKEFLAGS }}

      - name: Building
        run: cmake --build build --parallel $(getconf _NPROCESSORS_ONLN)

      - name: Testing
        run: cmake --build build --target test
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
          CTEST_PARALLEL_LEVEL: $(getconf _NPROCESSORS_ONLN)
